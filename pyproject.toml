[project]
name = "phone-to-floorplan"
version = "0.0.1"
description = "An iPhone walk-through of a damaged property becomes a measured floor plan, located damage, and a costed repair scope."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
  "numpy",
  "scipy",
  "opencv-python-headless",
  "pillow",
  "torch",
  "torchvision",
  "pyyaml",
  "jsonschema",
  "typer",
  "rich",
  "matplotlib",
  "imageio[ffmpeg]",
  "exifread",
  "huggingface_hub",
  "shapely",
  "pillow-heif",
  "transformers",
  "safetensors",
  "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
floorplan = "floorplan.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floorplan"]

[tool.ruff]
line-length = 110
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501",    # line length is handled by the formatter, not by failing the build
  "B023",    # loop-variable capture in closures: deliberate in the tier drivers
  "E741",    # single-letter names are fine in dense geometry code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]
