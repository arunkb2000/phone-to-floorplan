name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test
        # the integration test is skipped automatically when the capture data is absent,
        # which it is on CI: data/raw is 6 GB and ships alongside the repo, not inside it
        run: uv run pytest -q
